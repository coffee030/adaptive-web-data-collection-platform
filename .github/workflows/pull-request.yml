name: Core release verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHANNEL: chrome
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: google-chrome --version
      - run: npm test

  backend:
    name: Backend unit and Source onboarding tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m ruff check --config ruff.toml backend mcp_access scripts
      - run: python -m ruff format --config ruff.toml --check backend mcp_access scripts
      - name: Backend unit, Source policy and onboarding tests
        run: >-
          python -m pytest -p scripts.require_pytest_pass -q -ra
          backend/tests --ignore=backend/tests/m2
          backend/experiments/test_m22a_onboarding.py backend/experiments/test_m22b_suggestions.py

  data:
    name: PostgreSQL, migrations, Redis and queue integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: m21a-fixture-only
          POSTGRES_DB: collection_m21a
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U collection -d collection_m21a"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - name: Install the separate marketing MCP client
        run: python -m venv .venv/mcp && .venv/mcp/bin/python -m pip install -r mcp_access/requirements.txt
      - name: API, migrations, Evidence and persistence against PostgreSQL and Redis
        env:
          HARBOURLINE_MCP_TEST_PYTHON: ${{ github.workspace }}/.venv/mcp/bin/python
          M2_TEST_DATABASE_URL: postgresql+psycopg://collection:m21a-fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/collection_m21a
          M3_TEST_BROKER_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        run: >-
          python -m pytest -p scripts.require_pytest_pass -q -ra
          backend/tests/m2 --ignore=backend/tests/m2/test_m3_compose.py

  mcp:
    name: MCP protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp_access/requirements.txt
      - run: python -m pip install -r mcp_access/requirements.txt pytest==9.2.0
      - run: python -m pip check
      - name: Run the complete MCP suite
        timeout-minutes: 2
        run: python -m pytest -p scripts.require_pytest_pass -v -ra -o faulthandler_timeout=30 mcp_access/tests

  compose:
    name: Compose, migration, container frontend and controlled Demo
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            mcp_access/requirements.txt
      - run: npm ci --prefix frontend
      - run: google-chrome --version
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m venv .venv/mcp && .venv/mcp/bin/python -m pip install -r mcp_access/requirements.txt
      - run: bash scripts/release-compose.sh

  windows:
    name: Windows launcher tests
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - shell: powershell
        run: ./scripts/windows/Test-Launcher.ps1

  pilot:
    name: Controlled onboarding pilot tooling
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: node --test backend/experiments/m22c_completion.test.mjs
      - run: python -m pytest -p scripts.require_pytest_pass -q backend/experiments/m22c_score_test.py
      - run: python -m backend.experiments.m22c_validate_trials docs/evaluation/m22c-onboarding-results.csv
