name: Pull request verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: collection
          POSTGRES_PASSWORD: m21a-fixture-only
          POSTGRES_DB: collection_m21a
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U collection -d collection_m21a"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/experiments/scrapling_spike/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q backend/tests/test_m0_http.py backend/tests/test_m0_extraction.py backend/tests/m1
      - name: Job API contracts against PostgreSQL
        env:
          M2_TEST_DATABASE_URL: postgresql+psycopg://collection:m21a-fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/collection_m21a
          M3_TEST_BROKER_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        run: >-
          python -m pytest -p scripts.require_pytest_pass -v -ra
          backend/tests/m2/test_jobs.py::test_job_api_creates_a_pending_job
          backend/tests/m2/test_m20_attempt_identity.py
          backend/tests/m2/test_m3_reliability.py::test_expired_attempt_cannot_publish_or_fail_a_new_claim
          backend/tests/m2/test_m8_collections.py::test_multiple_sources_refresh_history_and_revocation

  mcp:
    name: MCP protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp_access/requirements.txt
      - run: python -m pip install -r mcp_access/requirements.txt pytest==9.2.0
      - run: python -m pip check
      - name: Run the complete MCP suite
        timeout-minutes: 2
        run: python -m pytest -p scripts.require_pytest_pass -v -ra -o faulthandler_timeout=30 mcp_access/tests
