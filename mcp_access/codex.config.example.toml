# Copy the table to the checkout's .codex/config.toml and replace the placeholders.
[mcp_servers.fyp]
command = '<ABSOLUTE_CHECKOUT_PATH>\mcp_access\.venv\Scripts\python.exe'
args = ["-m", "mcp_access.server"]
